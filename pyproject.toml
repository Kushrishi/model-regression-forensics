[project]
name = "model-regression-forensics"
version = "0.0.1"
description = "Research scaffold for provenance-aware causal debugging of ML model regressions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
research = [
    "accelerate>=1.2",
    "datasets>=3.2",
    "peft>=0.14",
    "torch>=2.5",
    "transformers>=4.47",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
