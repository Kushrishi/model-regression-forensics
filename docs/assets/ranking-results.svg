<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Model Regression Forensics: recorded root ranks</title><desc id="desc">Label overlap and lexical Jaccard rank first in both worlds. Grad-Dot and TracIn rank first and fifth. Random ranks third in both.</desc><rect width="1200" height="600" fill="#10181b"/><g font-family="Arial" fill="#f1f0e8"><text x="60" y="65" font-size="18" fill="#afbec2">KUSH RISHI / MODEL REGRESSION FORENSICS</text><text x="60" y="128" font-size="40">Simple baselines found both planted changes.</text><text x="520" y="190" font-size="18" fill="#afbec2">WORLD 00</text><text x="840" y="190" font-size="18" fill="#afbec2">WORLD 01</text><text x="60" y="241" font-size="24">Label overlap</text><rect x="520" y="215" width="45" height="32" fill="#725d50"/><text x="770" y="240" font-size="24" fill="#f3a58f">1</text><rect x="840" y="215" width="45" height="32" fill="#725d50"/><text x="1090" y="240" font-size="24" fill="#f3a58f">1</text><text x="60" y="294" font-size="24">Lexical Jaccard</text><rect x="520" y="268" width="45" height="32" fill="#725d50"/><text x="770" y="293" font-size="24" fill="#f3a58f">1</text><rect x="840" y="268" width="45" height="32" fill="#725d50"/><text x="1090" y="293" font-size="24" fill="#f3a58f">1</text><text x="60" y="347" font-size="24">Grad-Dot</text><rect x="520" y="321" width="45" height="32" fill="#725d50"/><text x="770" y="346" font-size="24" fill="#f3a58f">1</text><rect x="840" y="321" width="225" height="32" fill="#725d50"/><text x="1090" y="346" font-size="24" fill="#f3a58f">5</text><text x="60" y="400" font-size="24">TracIn</text><rect x="520" y="374" width="45" height="32" fill="#725d50"/><text x="770" y="399" font-size="24" fill="#f3a58f">1</text><rect x="840" y="374" width="225" height="32" fill="#725d50"/><text x="1090" y="399" font-size="24" fill="#f3a58f">5</text><text x="60" y="453" font-size="24">Random</text><rect x="520" y="427" width="135" height="32" fill="#725d50"/><text x="770" y="452" font-size="24" fill="#f3a58f">3</text><rect x="840" y="427" width="135" height="32" fill="#725d50"/><text x="1090" y="452" font-size="24" fill="#f3a58f">3</text><text x="60" y="535" font-size="17" fill="#afbec2">Root rank: 1 best, 5 last. Two constructed Banking77 worlds; three paired trajectories per world.</text><text x="60" y="565" font-size="17" fill="#afbec2">Known target labels and disjoint candidate pairs expose a shortcut. No general causal claim.</text></g></svg>