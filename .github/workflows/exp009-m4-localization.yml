name: Exp009 M4 matched localization

on:
  push:
    branches: [main]
    paths: ['research/M4_EXECUTION_REQUEST.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: exp009-m4-localization
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --extra dev
      - name: Verify prospectively pinned authorization
        run: uv run python scripts/verify_exp009_m4_authorization.py --verify-hosted-ci
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run python scripts/build_exp009_m4_blind_bundle.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-m4-blind-inputs
          path: artifacts/exp009/m4/blind
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-m4-benchmark-truth
          path: artifacts/exp009/m4/truth
          retention-days: 90
          if-no-files-found: error

  clean:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        trajectory: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --extra dev --extra research
      - uses: actions/download-artifact@v8.0.1
        with:
          name: exp009-m4-blind-inputs
          path: inputs/blind
      - name: Record runner provenance
        run: |
          mkdir -p evidence
          uname -a > evidence/runner.txt
          sw_vers >> evidence/runner.txt
          sysctl -n machdep.cpu.brand_string hw.memsize >> evidence/runner.txt
      - name: Train one clean model for this trajectory
        id: training
        continue-on-error: true
        run: |
          uv run python scripts/run_exp009_m4_localization.py \
            --mode clean --world-bundle inputs/blind/world_00.json \
            --trajectory-id '${{ matrix.trajectory }}' \
            --work-root evidence --output evidence/clean_summary.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: exp009-m4-clean-t${{ matrix.trajectory }}
          path: |
            evidence
            !evidence/**/model/**
          retention-days: 90
          if-no-files-found: error
      - name: Enforce training outcome after preserving evidence
        if: steps.training.outcome != 'success'
        run: exit 1

  composite:
    needs: [prepare, clean]
    runs-on: macos-15
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        trajectory: [0, 1, 2]
        world: ['world_00', 'world_01']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --extra dev --extra research
      - uses: actions/download-artifact@v8.0.1
        with:
          name: exp009-m4-blind-inputs
          path: inputs/blind
      - uses: actions/download-artifact@v8.0.1
        with:
          name: exp009-m4-clean-t${{ matrix.trajectory }}
          path: inputs/clean
      - name: Record runner provenance
        run: |
          mkdir -p evidence
          uname -a > evidence/runner.txt
          sw_vers >> evidence/runner.txt
          sysctl -n machdep.cpu.brand_string hw.memsize >> evidence/runner.txt
      - name: Train and blindly score all seven composite checkpoints
        id: scoring
        continue-on-error: true
        run: |
          uv run python scripts/run_exp009_m4_localization.py \
            --world-bundle 'inputs/blind/${{ matrix.world }}.json' \
            --clean-root inputs/clean --trajectory-id '${{ matrix.trajectory }}' \
            --work-root evidence \
            --output 'scores/${{ matrix.world }}_t${{ matrix.trajectory }}.json'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: exp009-m4-composite-evidence-${{ matrix.world }}-t${{ matrix.trajectory }}
          path: |
            evidence
            !evidence/**/model/**
            !evidence/composite_epoch_checkpoints/**
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: steps.scoring.outcome == 'success'
        with:
          name: exp009-m4-scores-${{ matrix.world }}-t${{ matrix.trajectory }}
          path: scores/*.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: failure() || steps.scoring.outcome != 'success'
        with:
          name: exp009-m4-incomplete-checkpoints-${{ matrix.world }}-t${{ matrix.trajectory }}
          path: evidence/composite_epoch_checkpoints
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce scoring outcome after preserving evidence
        if: steps.scoring.outcome != 'success'
        run: exit 1

  aggregate:
    needs: composite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --extra dev
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: exp009-m4-scores-*
          path: scores
          merge-multiple: true
      - run: |
          uv run python scripts/analyze_exp009_m4_localization.py \
            --input-root scores --output analysis/blind_aggregate.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-m4-finalized-blind-rankings
          path: analysis
          retention-days: 90
          if-no-files-found: error

  truth:
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --extra dev
      - uses: actions/download-artifact@v8.0.1
        with:
          name: exp009-m4-finalized-blind-rankings
          path: finalized
      - uses: actions/download-artifact@v8.0.1
        with:
          name: exp009-m4-benchmark-truth
          path: truth
      - name: Verify persisted blind digest before reading truth
        run: |
          uv run python scripts/score_exp009_m4_truth.py \
            --blind-aggregate finalized/blind_aggregate.json \
            --blind-sha256-file finalized/blind_aggregate.json.sha256 \
            --truth-root truth --output analysis/truth_evaluation.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-m4-truth-evaluation
          path: analysis
          retention-days: 90
          if-no-files-found: error
