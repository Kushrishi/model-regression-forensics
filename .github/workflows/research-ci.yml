name: Research CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: uv sync --extra dev --extra research

      - name: Full unit test suite
        run: uv run pytest
