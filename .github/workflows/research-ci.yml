name: Research CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install research dependencies
        run: uv sync --extra dev --extra research

      - name: Full unit test suite
        run: uv run pytest

      - name: Required numerical checks (no skips)
        run: |
          uv run --with captum==0.9.0 --with einops==0.8.0 pytest \
            tests/test_exp009_graddot.py \
            tests/test_exp009_tracin.py \
            tests/test_exp009_epoch_checkpoints.py \
            tests/test_lfq_replay_contract.py \
            --junitxml=numerical-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("numerical-results.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) >= 25, "Required numerical and replay tests were not collected"
          skipped = [case.attrib.get("name") for case in cases if case.find("skipped") is not None]
          assert not skipped, f"Required numerical tests skipped: {skipped}"
          PY
