name: Investigation browser
on:
  pull_request:
    paths:
      - 'src/model_forensics/**'
      - 'examples/investigations/**'
      - 'tests/browser/**'
      - '.github/workflows/inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/browser/investigation.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: investigation-browser-views
          path: inspection-*.png
