name: Investigation browser
on:
  pull_request:
    paths:
      - 'src/model_forensics/**'
      - 'examples/investigations/**'
      - 'examples/initial_comparison/**'
      - 'examples/banking_investigation.py'
      - 'tests/browser/**'
      - '.github/workflows/inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m model_forensics.investigation_report examples/investigations/digits examples/investigations/digits/current.html
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/browser/investigation.cjs
        env:
          MRF_REPORT_HTML: current.html
      - run: mrf-import examples/initial_comparison/policy.json examples/initial_comparison/predictions.csv /tmp/mrf-initial
      - run: node tests/browser/investigation.cjs
        env:
          MRF_REPORT_DIR: /tmp/mrf-initial
      - uses: actions/upload-artifact@v4
        with:
          name: investigation-browser-views
          path: inspection-*.png
