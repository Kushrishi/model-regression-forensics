name: Exp009 M4 input preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_exp009_m4_blind_bundle.py'
      - 'src/model_forensics/exp009_m4_bundle.py'
      - '.github/workflows/exp009-m4-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_exp009_m4_blind_bundle.py'
      - 'src/model_forensics/exp009_m4_bundle.py'
      - '.github/workflows/exp009-m4-preflight.yml'

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --extra dev
      - name: Reconstruct and verify frozen M3 identities without model training
        run: uv run python scripts/build_exp009_m4_blind_bundle.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-m4-pre-result-inputs
          path: artifacts/exp009/m4
          if-no-files-found: error
          retention-days: 90
