name: Attribution CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/model_forensics/exp009_trak.py"
      - "tests/test_exp009_trak.py"
      - "research/TRAK_FEASIBILITY.md"
      - ".github/workflows/attribution-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trak-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install research environment
        run: uv sync --extra dev --extra research

      - name: Install frozen TRAK feasibility dependency
        run: uv pip install traker==0.3.2

      - name: Verify TRAK adapter tests
        run: uv run pytest tests/test_exp009_trak.py

      - name: Lint adapter
        run: uv run ruff check src/model_forensics/exp009_trak.py tests/test_exp009_trak.py

      - name: Format adapter
        run: uv run ruff format --check src/model_forensics/exp009_trak.py tests/test_exp009_trak.py
