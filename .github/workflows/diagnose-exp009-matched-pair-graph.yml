name: Diagnose Exp009 matched-pair graph

on:
  push:
    branches: ["exp009-structurally-matched-benchmark"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install diagnostic dependencies
        run: |
          uv sync --extra dev
          uv pip install networkx==3.5
      - name: Diagnose eligible-pair matching capacity
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          import networkx as nx

          from model_forensics.exp009_classifier import validate_frozen_development_partition
          from model_forensics.exp009_data import (
              build_development_partition,
              load_banking77_train,
              validate_banking77_duplicate_profile,
          )
          from model_forensics.exp009_matched_benchmark import rank_matched_pairs

          evidence_root = Path(
              "experiments/009_stochastic_counterfactual_certification/"
              "pilot_evidence/clean"
          )
          clean_runs = {
              0: "clean_t0000_e7_bs32_lr2e5",
              1: "clean_t0001_e7_bs32_lr2e5",
              2: "clean_t0002_e7_bs32_lr2e5",
          }

          records = load_banking77_train(
              Path("artifacts/exp009/source/banking77_train.csv")
          )
          partition = build_development_partition(records)
          validate_banking77_duplicate_profile(partition)
          partition_sha = validate_frozen_development_partition(partition)

          recalls = {}
          predictions = {}
          for trajectory, run_id in clean_runs.items():
              root = evidence_root / run_id
              summary = json.loads((root / "train_summary.json").read_text())
              assert summary["official_test_split_loaded"] is False
              assert summary["development_partition_sha256"] == partition_sha
              recalls[trajectory] = {
                  str(k): float(v)
                  for k, v in summary["development_eval_metrics"][
                      "per_label_recall"
                  ].items()
              }
              rows = []
              for line in (root / "development_eval_predictions.jsonl").read_text().splitlines():
                  if line.strip():
                      row = json.loads(line)
                      rows.append(
                          {
                              "true_label": str(row["true_label"]),
                              "predicted_label": str(row["predicted_label"]),
                          }
                      )
              predictions[trajectory] = tuple(rows)

          ranked = rank_matched_pairs(
              partition,
              per_label_recall_by_trajectory=recalls,
              prediction_rows_by_trajectory=predictions,
          )

          graph = nx.Graph()
          rank_by_edge = {}
          for rank, pair in enumerate(ranked, start=1):
              edge = tuple(sorted((pair.label_a, pair.label_b)))
              graph.add_edge(*edge)
              rank_by_edge[edge] = rank

          maximum = nx.algorithms.matching.max_weight_matching(
              graph,
              maxcardinality=True,
              weight=None,
          )
          maximum_edges = sorted(
              (tuple(sorted(edge)) for edge in maximum),
              key=lambda edge: rank_by_edge[edge],
          )

          greedy = []
          used = set()
          for pair in ranked:
              edge = tuple(sorted((pair.label_a, pair.label_b)))
              if set(edge) & used:
                  continue
              greedy.append(edge)
              used.update(edge)

          print(f"DEVELOPMENT_PARTITION_SHA256={partition_sha}")
          print(f"ELIGIBLE_EDGE_COUNT={len(ranked)}")
          print(f"ELIGIBLE_VERTEX_COUNT={graph.number_of_nodes()}")
          print(f"GREEDY_DISJOINT_PAIR_COUNT={len(greedy)}")
          print(f"MAXIMUM_MATCHING_PAIR_COUNT={len(maximum_edges)}")
          print(f"THREE_WORLD_CAPACITY={len(maximum_edges) >= 15}")
          print("MAXIMUM_MATCHING_EDGES_IN_ORIGINAL_RANK_ORDER=")
          for edge in maximum_edges:
              print(f"  rank={rank_by_edge[edge]:03d} pair={edge[0]}<->{edge[1]}")
          print("OFFICIAL_TEST_SPLIT_LOADED=NO")
          print("MODEL_TRAINING_PERFORMED=NO")
          PY
