name: Exp009 Stage A

on:
  push:
    branches: ["main"]
    paths:
      - "experiments/009_stochastic_counterfactual_certification/STAGE_A_RUN_REQUEST.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exp009-stage-a
  cancel-in-progress: false

jobs:
  train:
    name: t${{ matrix.trajectory }} / ${{ matrix.state }}
    runs-on: macos-15
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        trajectory: [0, 1, 2]
        state: [baseline, composite]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install research dependencies
        run: uv sync --extra research --extra dev

      - name: Verify frozen state preflight
        run: |
          uv run python scripts/run_exp009_mps_certification_pilot.py \
            --mode preflight \
            --trajectory-id "${{ matrix.trajectory }}" \
            --state "${{ matrix.state }}"

      - name: Record hosted-runner provenance
        run: |
          {
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "uname=$(uname -a)"
            echo "macos=$(sw_vers -productVersion)"
            echo "cpu=$(sysctl -n machdep.cpu.brand_string)"
            echo "memory_bytes=$(sysctl -n hw.memsize)"
          } > runner_provenance.txt

      - name: Train frozen Stage-A state
        run: |
          uv run python scripts/run_exp009_mps_certification_pilot.py \
            --mode train \
            --trajectory-id "${{ matrix.trajectory }}" \
            --state "${{ matrix.state }}"

      - name: Package portable evidence
        shell: bash
        run: |
          run_id=$(printf "mps_v2_t%04d_%s_e7_bs32_lr2e5" "${{ matrix.trajectory }}" "${{ matrix.state }}")
          run_dir="artifacts/exp009/mps_certification_pilot_v2/runs/${run_id}"
          cp runner_provenance.txt "${run_dir}/runner_provenance.txt"
          if [[ "${{ matrix.state }}" == "baseline" ]]; then
            rm -rf "${run_dir}/model"
          fi
          shasum -a 256 "${run_dir}/train_summary.json" "${run_dir}/development_eval_logits.jsonl"
          cat "${run_dir}/train_summary.json"

      - name: Upload baseline evidence
        if: matrix.state == 'baseline'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-stage-a-t${{ matrix.trajectory }}-baseline
          path: artifacts/exp009/mps_certification_pilot_v2/runs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload composite evidence and checkpoint
        if: matrix.state == 'composite'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-stage-a-t${{ matrix.trajectory }}-composite
          path: artifacts/exp009/mps_certification_pilot_v2/runs/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  analyze:
    name: Frozen Stage-A gate
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install analysis dependencies
        run: uv sync --extra dev

      - name: Download all Stage-A evidence
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: exp009-stage-a-*
          path: artifacts/exp009/mps_certification_pilot_v2/runs
          merge-multiple: true

      - name: Apply frozen Stage-A gate
        run: |
          uv run python scripts/analyze_exp009_mps_stage_a.py
          cat artifacts/exp009/mps_certification_pilot_v2/stage_a_analysis.json

      - name: Upload Stage-A analysis
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exp009-stage-a-analysis
          path: artifacts/exp009/mps_certification_pilot_v2/stage_a_analysis.json
          if-no-files-found: error
          retention-days: 90
