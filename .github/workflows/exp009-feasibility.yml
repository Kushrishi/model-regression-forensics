name: Exp009 feasibility

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/model_forensics/exp009_trak.py"
      - "tests/test_exp009_trak_adapter.py"
      - "scripts/check_exp009_mps_runner.py"
      - "research/TRAK_FEASIBILITY.md"
      - ".github/workflows/exp009-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-mps:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install research dependencies
        run: uv sync --extra research --extra dev

      - name: Probe hosted MPS
        run: uv run python scripts/check_exp009_mps_runner.py

  trak-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install project research dependencies
        run: uv sync --extra research --extra dev

      - name: Install frozen TRAK feasibility version
        run: uv pip install traker==0.3.2

      - name: Run DistilBERT TRAK smoke test
        run: uv run pytest tests/test_exp009_trak_adapter.py -q
